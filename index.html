    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem("theme"); } catch {}
        const hour = new Date().getHours();
        const dark = preference === "dark" || (preference !== "light" && (hour >= 22 || hour < 6));
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
